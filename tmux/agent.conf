# # Run Claude Code or Open Code in a separate session depending on which is installed
bind -r b run-shell '\
  if command -v claude >/dev/null 2>&1; then AGENT=claude; \
  elif command -v opencode >/dev/null 2>&1; then AGENT=opencode; \
  else exit 1; fi; \
  HASH=$(printf "%s" "#{pane_current_path}" | shasum -a 256 | cut -c1-8); \
  SESSION="$AGENT-$HASH"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "$AGENT"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'
